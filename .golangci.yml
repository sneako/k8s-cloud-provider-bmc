version: "2"
linters:
  default: none
  enable:
  - govet
  - revive
  exclusions:
    # same default exclusions golangci-lint v1 applied
    presets:
    - comments
    - common-false-positives
    - legacy
    - std-error-handling
    rules:
    # newer revive default; most hits are interface method signatures
    - linters:
      - revive
      text: "^unused-parameter:"
formatters:
  enable:
  - gofmt
run:
  # Timeout for analysis, e.g. 30s, 5m.
  # Default: 1m
  timeout: 5m
